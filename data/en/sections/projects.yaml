# your projects
projects:
  - name: dhaaga
    role: Creator
    timeline: '2026'
    repo: https://github.com/punitpi/dhaaga
    liveUrl: https://dhaaga.nayanamurthy.com
    summary: Live website for a handmade crochet business, built with Next.js 16 and deployed on Vercel. Responsive single-page layout with a photo gallery and lightbox, OpenGraph metadata for social sharing, and Vercel Analytics. Content is managed through a single config object for easy updates.
    tags: ['Next.js', 'TypeScript', 'Vercel', 'Web App']

  - name: voiceScribe
    role: Creator
    timeline: '2025 - Present'
    repo: https://github.com/punitpi/voiceScribe
    summary: Full-stack voice transcription app with support for Kannada-English code-mixed audio. Authenticated multi-tenant access with an admin panel, a Bull/Redis job queue for async transcription with retry handling, a feature-flag system with per-user overrides, and analytics instrumentation for key user events. Dockerized frontend and backend.
    tags: ['TypeScript', 'Node.js', 'Redis', 'Docker', 'Full-Stack']

  - name: Long Leave Planner
    role: Creator
    timeline: '2026'
    repo: https://github.com/punitpi/LongLeavePlanner
    liveUrl: https://leavewise.puneeth.io
    summary: Finds the best days to take off work by identifying clusters of public holidays and weekends, then highlighting exactly which days to request for an extended break. Supports country-based auto-loading of holidays or manual/CSV date input, with calendar visualization and PDF export/share.
    tags: ['Next.js', 'TypeScript', 'Tailwind CSS', 'Web App']

  - name: TripWeave
    role: Creator
    timeline: '2026'
    summary: Collaborative, map-first trip planning app, currently in active development. Built with Next.js, Supabase, and Better Auth, with Google APIs integration for mapping and location data. Includes end-to-end test coverage with Playwright and Vitest.
    tags: ['Next.js', 'TypeScript', 'Supabase', 'Full-Stack']

  - name: Azure Terraform Modules
    role: Creator
    timeline: '2025'
    repo: https://github.com/punitpi/tf-azure-template
    summary: Modular, reusable Terraform configuration for provisioning Azure infrastructure, including resource groups, virtual networks, storage accounts, Key Vault, and App Service, with a remote state backend. Built to simplify and standardize Azure environment setup.
    tags: ['Terraform', 'Azure', 'IaC']

  - name: Homelab Infrastructure
    role: Creator
    timeline: '2024 - Present'
    repo: https://github.com/punitpi/homelab
    summary: Infrastructure-as-code for a reproducible, resilient personal homelab. Local-first architecture on Raspberry Pi with automated deployment via Ansible and Docker Compose. Features Traefik reverse proxy, Authentik SSO, Tailscale mesh networking, and automated Restic backups to Backblaze B2. Runs services like AdGuard Home, FreshRSS, Mealie, and OpenWebUI.
    tags: ['Docker', 'Ansible', 'Raspberry Pi', 'Tailscale', 'Self-Hosting', 'Infrastructure', 'Automation']

  - name: TypedByMe Portfolio
    role: Creator
    timeline: '2024 - Present'
    repo: https://github.com/punitpi/typedbyme
    summary: Personal portfolio and technical blog built with Hugo and the Toha v4 theme. Features dark mode support, GoatCounter analytics, integrated Spotify Now Playing bar, and optimized static site generation. Content managed through YAML config files and markdown posts.
    tags: ['Hugo', 'JavaScript', 'SCSS', 'Static Site', 'Portfolio', 'Blog']

  - name: Spotify Now Playing API
    role: Creator
    timeline: '2024'
    repo: https://github.com/punitpi/spotify-now-playing
    summary: Lightweight proxy service for Spotify's Currently Playing API. Handles OAuth token refresh and exposes a simple JSON endpoint with track metadata. Deployable on Cloudflare Workers, Vercel or any other service. Includes CORS support and optional 30-second caching to avoid rate limits.
    tags: ['JavaScript', 'Node.js', 'Cloudflare Workers', 'Spotify API', 'Docker']

  - name: My Express Template
    role: Creator
    timeline: '2023'
    repo: https://github.com/punitpi/my-express-template
    summary: Standard Express.js template with custom configurations and best practices for rapid API development. Includes authentication, error handling, and logging setup.
    tags: ['JavaScript', 'Node.js', 'Express.js', 'Backend']
