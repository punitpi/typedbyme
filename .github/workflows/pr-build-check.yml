name: PR Build Check

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: "pr-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Update Hugo Modules
        run: hugo mod tidy

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install theme npm deps (from hugo mod)
        run: |
          hugo mod npm pack
          npm install
          npm install cytoscape@3.30.2 --save-dev

      - name: Build site
        env:
          HUGO_ENV: production
        run: hugo --minify
